
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvexara"
version = "1.2.0"
description = "A lightweight web reconnaissance and security assessment tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Muhammad Khier Mardini" }
]

keywords = [
    "cybersecurity",
    "web-security",
    "reconnaissance",
    "security-assessment",
    "pentesting"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security"
]

dependencies = [
    "requests>=2.31.0,<3.0.0",
    "Jinja2>=3.1.0,<4.0.0"
]

[project.urls]
Homepage = "https://github.com/muhmardini/Ruvexara"
Repository = "https://github.com/muhmardini/Ruvexara"
Issues = "https://github.com/muhmardini/Ruvexara/issues"

[project.scripts]
ruvexara = "ruvexara.ruvexara:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ruvexara*"]

[tool.setuptools.package-data]
ruvexara = ["templates/*.html"]
